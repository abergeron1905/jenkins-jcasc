jenkins:
  systemMessage: "Instance Jenkins JCasC fonctionnelle sous Podman et WSL2 !"
  numExecutors: 1
  mode: NORMAL

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      pipelineJob('Mon-Premier-Pipeline-Automatique') {
        description('Ce pipeline a été généré automatiquement via la Configuration as Code !')
        definition {
          cps {
            script('''
              pipeline {
                  agent any
                  stages {
                      stage('Construction 🏗️') {
                          steps { echo 'Compilation et préparation...' }
                      }
                      stage('Tests 🧪') {
                          steps { echo 'Exécution des tests... ✅' }
                      }
                      stage('Déploiement 🚀') {
                          steps { echo 'Déploiement en cours...' }
                      }
                  }
              }
            ''')
            sandbox(true)
          }
        }
      }